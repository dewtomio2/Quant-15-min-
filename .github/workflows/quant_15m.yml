name: Quant 15m Alert

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-15m
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alert_15m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: alert_15m/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alert_once.py

      - name: Save state and log
        run: |
          git config user.name "quant-bot"
          git config user.email "quant-bot@users.noreply.github.com"
          git add last_alerted.json
          if [ -f signal_log_15m.csv ]; then git add signal_log_15m.csv; fi
          if git diff --cached --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "update signal state"
            git pull --rebase
            git push
          fi
